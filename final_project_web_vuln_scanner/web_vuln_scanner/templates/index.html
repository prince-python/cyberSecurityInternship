<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web Vulnerability Scanner</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tesla Font -->
  <link href="https://db.onlinewebfonts.com/c/41d92fd78c10238a92a7d24a74968f36?family=TESLA+Regular" rel="stylesheet" type="text/css"/>

  <style>
    @import url('https://db.onlinewebfonts.com/c/41d92fd78c10238a92a7d24a74968f36?family=TESLA+Regular');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: "TESLA Regular", monospace;
      overflow-x: hidden;
    }

    .hacker-green {
      color: #00ff88;
    }

    .glow {
      text-shadow: 0 0 5px #00ff88, 0 0 10px #00ff88, 0 0 20px #00ff88;
    }

    .navbar {
      background-color: #111 !important;
      border-bottom: 1px solid #00ff88;
    }

    .footer {
      background-color: #111;
      color: #888;
      padding: 10px 0;
      text-align: center;
      border-top: 1px solid #00ff88;
    }

    .btn-outline-success {
      border-color: #00ff88;
      color: #00ff88;
    }

    .btn-outline-success:hover {
      background-color: #00ff88;
      color: #000;
    }

    .form-control {
      background-color: #111;
      color: #fff;
      border: 1px solid #00ff88;
      font-family: "TESLA Regular", monospace;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .spinner-container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-content {
      display: none;
    }

    .hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.2rem;
    }

    @media (min-width: 768px) {
      .hero h1 {
        font-size: 3rem;
      }
    }

    .input-group {
      max-width: 700px;
      width: 100%;
    }

    input, button {
      font-family: "TESLA Regular", monospace !important;
    }
  </style>
</head>
<body>

  <!-- Spinner -->
  <div class="spinner-container" id="loader">
    <div class="text-center">
      <div class="spinner-border text-success" role="status" style="width: 4rem; height: 4rem;"></div>
      <p class="mt-3 hacker-green">Loading Cyber Scanner...</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
      <div class="container">
        <span class="navbar-brand hacker-green glow">🔍 Web Vuln Scanner</span>
      </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
      <h1 class="hacker-green glow">Analyze Web Vulnerabilities Like a Pro</h1>
      <p class="mt-3 text-white">Enter a website URL to scan for potential security issues.</p>

      <form class="input-group mt-4" method="POST"  action="/result/">
        {% csrf_token %}
        <input type="url" name="target" class="form-control" placeholder="https://example.com" required>
        <button class="btn btn-outline-success">Scan</button>
      </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>Built by Prince JAT 🛡 | Full-Stack & Cybersecurity Enthusiast</p>
    </footer>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Show main content after load -->
  <script>
    window.onload = function () {
      document.getElementById("loader").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    };
  </script>
</body>
</html>
